# This job runs the source-only tests for the Python modules without a native KVBM wheel.
# A strict test bootstrap replaces `kvbm._core` and fails if a test uses it.
# The wheel jobs run extension tests on each target architecture.
#
# ruff/mypy are best-effort: the repo currently ships NO ruff/mypy config, so
# they run with defaults under continue-on-error. TODO(human): add a [tool.ruff]
# / mypy config to pyproject.toml and then make these blocking.

name: Python Lint

on:
  pull_request:
    paths:
      - 'python/**'
      - 'pyproject.toml'
      - '.github/workflows/python-lint.yml'
  push:
    branches:
      - main
      - release/*.*.*
    paths:
      - 'python/**'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-lint:
    name: ruff / pytest (source-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint/test tooling
        run: |
          python -m pip install -U pip
          pip install ruff pytest

      - name: ruff (best-effort, no config yet)
        continue-on-error: true
        run: ruff check python

      - name: pytest (source-only)
        env:
          PYTHONPATH: ${{ github.workspace }}/python/tests/source_only:${{ github.workspace }}/python
        run: pytest python/tests -q -rs

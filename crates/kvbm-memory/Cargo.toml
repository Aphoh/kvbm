[package]
name = "kvbm-memory"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "KV Block Manager memory layer (forked from dynamo-memory)"

[features]
default = []

# resources/ + the two bins. kvbm-service only. (hugepage.rs / mmap_pinned.rs
# stay unconditional: ungated numa/worker_pool.rs needs mmap_pinned, which
# needs hugepage — gating them breaks the default-features build.)
host-pools = []

# feature to enable unsafe slices of memory descriptors
# for advanced testing in other crates
unsafe-slices = []

# test features for hardware-specific tests
testing-cuda = []
testing-nixl = []
testing-all = ["testing-cuda", "testing-nixl"]

[dependencies]
anyhow = "1"
cudarc = { workspace = true }
nixl-sys = { workspace = true }
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2.0.17"
tracing = "0.1"

libc = "0.2"
libloading = "0.8.9"
nix = { version = "0.30", features = ["fs"] }
offset-allocator = "0.2"

[[bin]]
name = "validate_numa_placement"
path = "bin/validate_numa_placement.rs"
required-features = ["host-pools"]

[[bin]]
name = "inspect_resources"
path = "bin/inspect_resources.rs"
required-features = ["host-pools"]

[dev-dependencies]
serde_json = "1"
tempfile = "3"
